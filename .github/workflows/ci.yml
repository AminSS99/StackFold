name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test & Lint
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Type check (TypeScript + Cargo check)
        run: pnpm typecheck

      - name: Run test suites (Vitest + Cargo test)
        run: pnpm test

      - name: Run linters (ESLint + Cargo Clippy + Cargo fmt check)
        run: pnpm lint

      - name: Build web static export & sidecar
        run: pnpm build:web
